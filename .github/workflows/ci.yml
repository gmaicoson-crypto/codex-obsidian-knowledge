name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.136.0
      - name: Validate PowerShell repository
        shell: pwsh
        run: ./tests/repository-validation.ps1
      - name: Validate skill behavior cases
        shell: pwsh
        run: ./tests/validate-skill-evals.ps1
      - name: Validate release metadata
        shell: pwsh
        run: ./tests/release-validation.ps1
      - name: Install and remove plugin with Codex CLI
        shell: pwsh
        run: ./tests/codex-cli-validation.ps1

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.136.0
      - name: Install shellcheck
        run: brew install shellcheck
      - name: Run shellcheck
        shell: bash
        run: shellcheck -S error scripts/*.sh tests/*.sh
      - name: Validate shell repository
        shell: bash
        run: bash tests/repository-validation.sh
      - name: Validate release metadata
        shell: pwsh
        run: ./tests/release-validation.ps1
      - name: Install and remove plugin with Codex CLI
        shell: bash
        run: bash tests/codex-cli-validation.sh
