name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate tag and version metadata
        shell: pwsh
        run: ./tests/release-validation.ps1 -Tag '${{ github.ref_name }}'
      - name: Build reproducible source archive and checksum
        shell: bash
        run: |
          archive="codex-obsidian-knowledge-${GITHUB_REF_NAME}.zip"
          git archive --format=zip --prefix=codex-obsidian-knowledge/ --output="$archive" HEAD
          sha256sum "$archive" > "$archive.sha256"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          archive="codex-obsidian-knowledge-${GITHUB_REF_NAME}.zip"
          gh release create "$GITHUB_REF_NAME" "$archive" "$archive.sha256" --verify-tag --generate-notes
